name: Deploy to GCP via SSH

# Сценарій запускається лише при пуші в гілку main
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Executing remote SSH commands to deploy
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.GCP_HOST }}
        username: ${{ secrets.GCP_USERNAME }}
        key: ${{ secrets.GCP_SSH_KEY }}
        script: |
          # 1. Переходимо в папку з проєктом на сервері (вкажіть правильну назву папки вашого репозиторію)
          cd ~/BookBlog
          
          # 2. Стягуємо найсвіжіші зміни з GitHub
          git pull origin main
          
          # 3. Перезбираємо контейнери з новим кодом у фоновому режимі
          RENDER_DB_URL="${{ secrets.RENDER_DB_URL }}" SECRET_KEY="${{ secrets.SECRET_KEY }}" docker-compose up --build -d
          
          # 4. Очищаємо застарілі docker-образи, які більше не використовуються (щоб не забивати диск)
          docker image prune -f